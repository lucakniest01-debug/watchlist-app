<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orbit-Hopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600&display=swap">
<style>
/* Layout: one full-screen canvas, HUD floats top, overlay card centered. Single dark theme (night sky). */
:root {
  --sky: #0b0d1f;
  --sky-2: #151a3a;
  --ink: #e9ecff;
  --muted: #8e95c4;
  --star: #ffc857;
  --planet: #5ec8e5;
  --danger: #ff6b6b;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Chakra Petch", ui-monospace, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 40%, var(--sky-2), var(--sky) 70%);
  background-color: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
#app { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.hud {
  position: absolute; top: 12px; left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: baseline;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.hud .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hud .val { font-family: var(--display); font-size: 28px; color: var(--star); line-height: 1; }
.hud .right { text-align: right; }
.hud .right .val { color: var(--ink); font-size: 20px; }
.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(11, 13, 31, .55);
  backdrop-filter: blur(2px);
}
.card {
  max-width: 360px; width: 100%;
  text-align: center;
  display: grid; gap: 14px;
}
h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(36px, 10vw, 54px); line-height: .95; margin: 0;
  color: var(--ink); text-wrap: balance;
  text-shadow: 0 0 24px rgba(94, 200, 229, .45);
}
h1 span { color: var(--star); }
.card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
.keys { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink); }
kbd {
  font-family: var(--body); font-weight: 600;
  border: 1px solid var(--muted); border-bottom-width: 3px; border-radius: 6px;
  padding: 2px 8px; color: var(--ink);
}
.big { font-family: var(--display); font-size: 44px; color: var(--star); line-height: 1; }
button {
  justify-self: center;
  font-family: var(--display); font-size: 18px; letter-spacing: .04em;
  color: var(--sky); background: var(--star);
  border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer;
  box-shadow: 0 0 0 0 rgba(255, 200, 87, .6);
  animation: pulse 1.8s infinite;
}
button:focus-visible { outline: 3px solid var(--planet); outline-offset: 3px; }
@keyframes pulse { 70% { box-shadow: 0 0 0 14px rgba(255, 200, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 200, 87, 0); } }
@media (prefers-reduced-motion: reduce) { button { animation: none; } }
</style>

<div id="app">
  <canvas id="c" aria-label="Spielfeld"></canvas>
  <div class="hud">
    <div><div class="label">Sterne</div><div class="val" id="score">0</div></div>
    <div class="right"><div class="label">Rekord</div><div class="val" id="best">0</div></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card" id="card">
      <h1>Orbit<br><span>Hopper</span></h1>
      <p>Dein Raumschiff kreist um einen Planeten. Wechsle die Umlaufbahn, sammle Sterne und weiche den Meteoren aus.</p>
      <div class="keys"><span><kbd>Tippen</kbd> / <kbd>Leertaste</kbd> nach außen</span><span><kbd>↓</kbd> nach innen</span></div>
      <button id="start" type="button">Start</button>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const card = document.getElementById('card');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const css = getComputedStyle(document.documentElement);
  const C = {
    star: css.getPropertyValue('--star').trim(),
    planet: css.getPropertyValue('--planet').trim(),
    danger: css.getPropertyValue('--danger').trim(),
    ink: css.getPropertyValue('--ink').trim(),
    muted: css.getPropertyValue('--muted').trim()
  };

  let best = 0;
  try { best = +localStorage.getItem('orbitBest') || 0; } catch (e) {}
  bestEl.textContent = best;

  let W = 0, H = 0, cx = 0, cy = 0, unit = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2; cy = H / 2 + 14;
    unit = Math.min(W, H - 60) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // Hintergrundsterne
  const bg = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + .2, t: Math.random() * 6 }));

  const RINGS = [0.38, 0.6, 0.82]; // Anteil von unit
  const ringR = i => RINGS[i] * unit;

  let state = 'menu';
  let p, stars, rocks, parts, score, time, spawnT, speed, shake;

  function reset() {
    p = { ring: 1, r: ringR(1), a: -Math.PI / 2, dir: 1 };
    stars = []; rocks = []; parts = [];
    score = 0; time = 0; spawnT = 1.2; speed = 1; shake = 0;
    scoreEl.textContent = 0;
    for (let i = 0; i < 3; i++) addStar();
  }

  function addStar() {
    const ring = Math.floor(Math.random() * 3);
    let a;
    do { a = Math.random() * Math.PI * 2; } while (ring === p.ring && angDist(a, p.a) < 1);
    stars.push({ ring, a, t: 0 });
  }
  function angDist(a, b) { let d = Math.abs(a - b) % (Math.PI * 2); return d > Math.PI ? Math.PI * 2 - d : d; }

  function addRock() {
    const ang = Math.random() * Math.PI * 2;
    const dist = unit * 1.35;
    const x = cx + Math.cos(ang) * dist, y = cy + Math.sin(ang) * dist;
    // zielt grob auf den Planeten, mit Streuung
    const off = (Math.random() - .5) * unit * 0.7;
    const tx = cx + Math.cos(ang + Math.PI / 2) * off, ty = cy + Math.sin(ang + Math.PI / 2) * off;
    const len = Math.hypot(tx - x, ty - y);
    const v = unit * (0.32 + Math.random() * 0.18) * speed;
    rocks.push({ x, y, vx: (tx - x) / len * v, vy: (ty - y) / len * v, s: unit * (0.035 + Math.random() * 0.03), rot: Math.random() * 6, vr: (Math.random() - .5) * 3, life: 0 });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (Math.random() * 120 + 40);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
    }
  }

  function hop(dir) {
    if (state !== 'play') return;
    p.ring = dir > 0 ? (p.ring + 1) % 3 : (p.ring + 2) % 3;
  }

  function start() {
    reset();
    state = 'play';
    overlay.hidden = true;
  }

  function gameOver() {
    state = 'over';
    shake = 14;
    const px = cx + Math.cos(p.a) * p.r, py = cy + Math.sin(p.a) * p.r;
    burst(px, py, C.danger, 40);
    let rec = false;
    if (score > best) { best = score; rec = true; try { localStorage.setItem('orbitBest', best); } catch (e) {} bestEl.textContent = best; }
    setTimeout(() => {
      card.innerHTML = `
        <h1>Crash!</h1>
        <div class="big">${score}</div>
        <p>${rec ? 'Neuer Rekord! ' : ''}${score === 1 ? 'Stern' : 'Sterne'} gesammelt in ${time.toFixed(1)} Sekunden.</p>
        <button id="again" type="button">Nochmal</button>`;
      overlay.hidden = false;
      const b = document.getElementById('again');
      b.addEventListener('click', start);
      b.focus();
    }, 650);
  }

  // Eingabe
  document.getElementById('start').addEventListener('click', start);
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (state === 'play') hop(1); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === 'play') hop(1); else if (!overlay.hidden && document.activeElement?.tagName !== 'BUTTON') start();
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); hop(-1); }
    else if (e.code === 'Enter' && state !== 'play' && document.activeElement?.tagName !== 'BUTTON') start();
  });

  function update(dt) {
    time += dt;
    speed = 1 + time / 40;
    // Spieler: konstante Bahngeschwindigkeit, weicher Ringwechsel
    p.r += (ringR(p.ring) - p.r) * Math.min(1, dt * 14);
    p.a += dt * (unit * 0.95 * (0.9 + time / 120)) / Math.max(p.r, 1);
    const px = cx + Math.cos(p.a) * p.r, py = cy + Math.sin(p.a) * p.r;
    const pr = unit * 0.035;

    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i]; s.t += dt;
      const sx = cx + Math.cos(s.a) * ringR(s.ring), sy = cy + Math.sin(s.a) * ringR(s.ring);
      if (Math.hypot(px - sx, py - sy) < pr + unit * 0.045) {
        stars.splice(i, 1); score++; scoreEl.textContent = score;
        burst(sx, sy, C.star, 14); addStar();
        if (stars.length < 3 + Math.floor(time / 30)) addStar();
      }
    }

    spawnT -= dt;
    if (spawnT <= 0) { addRock(); spawnT = Math.max(0.35, 1.5 - time / 45) * (0.7 + Math.random() * 0.6); }

    const planetR = unit * 0.17;
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; r.life += dt;
      if (Math.hypot(r.x - cx, r.y - cy) < planetR + r.s * .5) { burst(r.x, r.y, C.muted, 8); rocks.splice(i, 1); continue; }
      if (r.life > 12) { rocks.splice(i, 1); continue; }
      if (Math.hypot(r.x - px, r.y - py) < pr + r.s * 0.8) { rocks.splice(i, 1); gameOver(); return; }
    }
  }

  function updateParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .96; q.vy *= .96; q.life -= dt * 1.6;
      if (q.life <= 0) parts.splice(i, 1);
    }
    shake *= 0.88;
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > .5) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    for (const s of bg) {
      ctx.globalAlpha = .35 + .35 * Math.sin(now / 900 + s.t);
      ctx.fillStyle = C.ink;
      ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // Bahnen
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(cx, cy, ringR(i), 0, Math.PI * 2);
      ctx.strokeStyle = p && i === p.ring && state === 'play' ? 'rgba(94,200,229,.45)' : 'rgba(142,149,196,.18)';
      ctx.lineWidth = 1.5; ctx.setLineDash([4, 8]); ctx.stroke();
    }
    ctx.setLineDash([]);

    // Planet
    const planetR = unit * 0.17;
    const g = ctx.createRadialGradient(cx - planetR * .35, cy - planetR * .35, planetR * .1, cx, cy, planetR);
    g.addColorStop(0, '#bff0fb'); g.addColorStop(.55, C.planet); g.addColorStop(1, '#1f5e78');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, planetR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(191,240,251,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(cx, cy, planetR * 1.5, planetR * .35, -0.35, 0, Math.PI * 2); ctx.stroke();

    if (p) {
      // Sterne
      for (const s of stars) {
        const sx = cx + Math.cos(s.a) * ringR(s.ring), sy = cy + Math.sin(s.a) * ringR(s.ring);
        const k = Math.min(1, s.t * 4) * (1 + .12 * Math.sin(now / 200 + s.a * 5));
        drawStar(sx, sy, unit * 0.04 * k, now / 1500 + s.a);
      }
      // Meteore
      for (const r of rocks) {
        ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
        ctx.fillStyle = '#6b5a7a'; ctx.strokeStyle = C.danger; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2, rr = r.s * (k % 2 ? .78 : 1); k ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(rr, 0); }
        ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }
      // Spieler
      if (state !== 'over') {
        const px = cx + Math.cos(p.a) * p.r, py = cy + Math.sin(p.a) * p.r;
        const s = unit * 0.045;
        ctx.save(); ctx.translate(px, py); ctx.rotate(p.a + Math.PI);
        ctx.fillStyle = 'rgba(255,200,87,.5)';
        ctx.beginPath(); ctx.moveTo(-s * .2, s * .5); ctx.lineTo(-s * .2 - s * (0.6 + Math.random() * .5), 0 + s * .5); ctx.lineTo(-s * .2, s * .1); ctx.fill();
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = C.ink;
        ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * .65, s * .7); ctx.lineTo(0, s * .35); ctx.lineTo(-s * .65, s * .7); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.life); ctx.fillStyle = q.color;
      ctx.fillRect(q.x - 2, q.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawStar(x, y, r, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.shadowColor = C.star; ctx.shadowBlur = 12;
    ctx.fillStyle = C.star; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * .45 : r; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  // Menü-Demo: Spieler kreist schon vor dem Start
  reset();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    else if (state === 'menu') { p.r += (ringR(p.ring) - p.r) * .2; p.a += dt * 1.2; }
    updateParts(dt);
    draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body></html>
